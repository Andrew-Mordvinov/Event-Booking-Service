global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-api
    static_configs:
      - targets: ["events-api:80"]
    metrics_path: /metrics

  - job_name: bookings-api
    static_configs:
      - targets: ["bookings-api:80"]
    metrics_path: /metrics

  - job_name: users-api
    static_configs:
      - targets: ["users-api:80"]
    metrics_path: /metrics